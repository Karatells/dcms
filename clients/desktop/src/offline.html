<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нет подключения</title>
  <style>
    :root { color-scheme: dark light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f1219; color: #eef2ff;
    }
    .card {
      width: 100%; max-width: 420px; padding: 28px; border-radius: 18px;
      background: #171c28; border: 1px solid #262e42; box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 8px; font-size: 1.3rem; }
    p { margin: 0 0 18px; color: #9aa6c1; line-height: 1.45; font-size: .95rem; }
    .url { font-family: monospace; font-size: .85rem; color: #7aa2ff; word-break: break-all; margin-bottom: 18px; }
    label { display: block; font-size: .82rem; color: #9aa6c1; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #2d3750;
      background: #0f131d; color: #eef2ff; font-size: .95rem; margin-bottom: 14px;
    }
    .row { display: flex; gap: 10px; }
    button {
      flex: 1; padding: 10px 14px; border-radius: 10px; border: 0; font-weight: 600;
      cursor: pointer; font-size: .95rem;
    }
    .primary { background: #4f7cff; color: #fff; }
    .primary:hover { background: #3f6bf0; }
    .ghost { background: #232b3d; color: #dbe4ff; }
    .ghost:hover { background: #2d3750; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Не удалось подключиться</h1>
    <p>Проверьте интернет-соединение или адрес сервера соцсети.</p>
    <div class="url" id="cur"></div>
    <label for="inp">Адрес сервера (https://...)</label>
    <input id="inp" type="url" placeholder="https://example.com">
    <div class="row">
      <button class="primary" id="retryBtn">Повторить</button>
      <button class="ghost" id="saveBtn">Сохранить адрес</button>
    </div>
  </div>
  <script>
    (async () => {
      const url = await window.dcmsNative.getServerUrl();
      document.getElementById('cur').textContent = url;
      document.getElementById('inp').value = url;
      document.getElementById('retryBtn').onclick = () => window.dcmsNative.retry();
      document.getElementById('saveBtn').onclick = async () => {
        const v = document.getElementById('inp').value.trim();
        if (!v) return;
        await window.dcmsNative.setServerUrl(v);
      };
    })();
  </script>
</body>
</html>
